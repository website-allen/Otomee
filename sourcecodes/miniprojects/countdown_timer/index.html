<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js project 12-countdown timer II</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
   <div class="container">
     <h1>Event Starts in</h1>
     <div id="countdown">

        <span class="date">
          <span id="day">00</span>
          <span class="date-text">days</span>
        </span>

        <span class="date">
          <span id="hour">00</span>
          <span class="date-text">Hours</span>
        </span>

        <span class="date">
          <span id="minutes">00</span>
          <span class="date-text">minutes</span>
        </span>

        <span class="date">
          <span id="seconds">00</span>
          <span class="date-text">Seconds</span>
        </span>

     </div>
   </div> 
</body>
</html>
