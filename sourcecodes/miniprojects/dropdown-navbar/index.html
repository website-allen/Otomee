<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive dropdown nav bar by Coding Otomee</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="site-name">Nuso Jewels</div>

    <div class="container">
      <input type="checkbox" id="toggle">
      <div class="label-container">
        <label for="toggle" id="label-1">&#9781;</label>
        <label for="toggle" id="label-2">&#10005;</label>
      </div>

      <nav id="nav">
        <a href="index.html">Home</a>
        <a href="#">Contact Us</a>
        <!--btn 1-->
        <div class="btn-1-top">
          <button id="btn-1">
            Clothes&nbsp;&nbsp;|&nbsp;&nbsp;+
            <div class="btn-1-body">
              <a href="#">Men</a>
              <a href="#">women</a>
              <a href="#">Children</a>
            </div>

          </button>
        </div>

        <!--btn 2-->
        <div class="btn-2-top">
          <button id="btn-2">
            Shoes&nbsp;&nbsp;|&nbsp;&nbsp;+
            <div class="btn-2-body">
              <a href="#">Male</a> 
              <a href="#">Female</a>
            </div>
          </button>
        </div>

        <a href="#">Support Us</a>

        <div id="night-day-container">
          <input type="checkbox" id="night-day-toggle">
          <label for="night-day-toggle" id="night-mode">&#9789;</label>
          <label for="night-day-toggle" id="day-mode">&#x263c;</label>
        </div>

      </nav>
    </div>
  </header>
  
</body>
</html>
