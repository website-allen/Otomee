<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflecting glowing icons by Coding Otomee</title>
    <style type="text/css">
        .glow-div {
         display: flex;
         border: 1px solid #000;
         height: 170px;
         background: #000;
         align-items: center;
         justify-content: center;
        }

        a {
         margin: 0 10px;
         border-radius: 50%;
         width: 50px;
         height: 50px;
         display: flex;
         justify-content: center;
         align-items: center;
         text-decoration: none;
         transition: 1.2s ease;
         background: #000;
         color: var(--color);
         font-size: 2.3em;
         -webkit-box-reflect: below 5px linear-gradient(to bottom, rgba(0,0,0,.0), rgba(0,0,0,.4));
    }

         a:hover {
            color: #000;
            background: var(--color);
            box-shadow: 0 0 5px var(--color), 0 0 25px var(--color), 0 0 50px var(--color), 0 0 200px var(--color)
         }

        
    </style>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="glow-div">
        <a href="#" style="--color: red">
            <i class="fa-brands fa-youtube"></i>
        </a>

        <a href="#" style="--color: #D62976">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="#" style="--color: #199E98">
            <i class="fa-brands fa-tiktok"></i>
        </a>

        <a href="#" style="--color: #4267B2">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
    </div>
</body>
</html>
