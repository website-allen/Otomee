<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isotope Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    <script src="script.js" defer></script>
    
</head>
<body>
    <div class="container">
        <h1>Game Gallery</h1>
        <div class="filters">
            <button class="active" data-filter="*">All</button>
            <button data-filter=".action">Action</button>
            <button data-filter=".racing">Racing</button>
            <button data-filter=".adventure">Adventure</button>
            <button data-filter=".multiplayer">multiplayer</button>
        </div>

        <div class="grid">
            <div class="item action">
                <h3>Call of Duty</h3>
                <p>Action</p>
            </div>

            <div class="item racing">
                <h3>Need for Speed</h3>
                <p>Racing</p>
            </div>

            <div class="item adventure">
                <h3>Minecraft</h3>
                <p>Adventure</p>
            </div>

            <div class="item multiplayer action">
                <h3>Fortnite</h3>
                <p>multiplayer</p>
            </div>

            <div class="item action">
                <h3>GTA V</h3>
                <p>Action</p>
            </div>

            <div class="item multiplayer">
                <h3>PUBG</h3>
                <p>multiplayer</p>
            </div>

            <div class="item adventure">
                <h3>Elden Ring</h3>
                <p>Adventure</p>
            </div>

            <div class="item racing multiplayer">
                <h3>Asphalt 8</h3>
                <p>Racing</p>
            </div>
        </div>
    </div>
    
</body>
</html>
